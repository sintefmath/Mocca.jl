version: 2
updates:
  # Bumps the [compat] entries in Project.toml
  - package-ecosystem: "julia"
    directory: "/"
    schedule:
      interval: "weekly"
  # Bumps the actions used in .github/workflows, in one PR
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
